# DeepLoader — Gradle Performance Configuration
# Developer: Sonu Verma

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel project execution
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# JVM args — 4GB heap for Android builds in Codespace
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin incremental compilation
kotlin.incremental=true

# AndroidX migration
android.useAndroidX=true

# Enable non-transitive R classes (reduces build time)
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Disable Jetifier (not needed for modern libs)
android.enableJetifier=false
